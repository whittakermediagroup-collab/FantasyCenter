name: Update injuries and deploy

on:
  schedule:
    # 12:00 UTC daily ≈ 7-8am Eastern depending on DST. Change the cron
    # expression below if you want a different time — cron is UTC.
    - cron: "0 12 * * *"
  push:
    branches: [main]
  workflow_dispatch: {} # lets you click "Run workflow" in the Actions tab on demand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Refresh injury data from ESPN
        run: npm run update-injuries
        # This step is best-effort: update-injuries.mjs exits 0 even on
        # partial/total failure so a bad ESPN response never blocks deploy.

      - name: Refresh ADP data
        run: npm run update-adp
        # Same fail-soft policy as the injury step.

      - name: Refresh team rosters from ESPN
        run: npm run update-teams
        # Checks all 32 rosters daily — the actual fix for stale team data
        # after trades/releases (e.g. Mixon/Montgomery). Same fail-soft policy.

      - name: Auto-discover offensive rookies from ESPN rosters
        run: npm run update-rookies
        # Scans all 32 active rosters for every true rookie (experience.years
        # === 0) at QB/RB/WR/TE, instead of relying on hand-picked names -
        # full coverage of anyone actually on a 53-man roster. Same fail-soft
        # policy.

      - name: Refresh durability history from nflverse
        run: npm run update-durability
        # Computes real durability data for the whole player pool from
        # official NFL injury reports (nflverse), not just the ~18 hand-
        # researched players. Same fail-soft policy.

      - name: Refresh season usage (snap share, target share) from nflverse
        run: npm run update-usage
        # 2025 final-season snap share / target share for the whole pool -
        # the honest, more predictive substitute for untracked preseason
        # snaps. Same fail-soft policy.

      - name: Refresh FantasyPros consensus ADP (second market source)
        run: npm run update-fantasypros-adp
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        # Optional second ADP source blending ESPN/CBS/RTSports/Fantrax/
        # Sleeper consensus. If the FANTASYPROS_API_KEY repo secret isn't
        # set, this step exits cleanly and the app runs on FFC ADP alone -
        # same fail-soft policy as every other update script.

      - name: Build app bundle
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r dist site/dist
          cp -r data site/data
          cp -r assets site/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
