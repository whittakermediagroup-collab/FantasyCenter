<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draft Command — Fantasy Draft Assistant</title>
  <meta name="description" content="12-team PPR snake draft assistant with a value-based recommendation engine and a daily-refreshed injury board." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230A100D'/%3E%3Cpath d='M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z' fill='none' stroke='%237CE38B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <!-- Content-Security-Policy: real, enforced browser-side defense-in-depth.
       Achievable this strictly specifically because this site now has zero
       external script dependencies (React/Tailwind/fonts are all bundled or
       self-hosted - see the notes below). script-src 'self' means even if a
       future bug ever let an attacker inject a <script> tag, the browser
       would refuse to run it. GitHub Pages has no server config, so this
       can only be set via meta tag - that means frame-ancestors (clickjack
       protection) is unavailable, since the CSP spec explicitly ignores
       that directive when delivered this way; it requires a real HTTP
       header, which GitHub Pages doesn't let us set. Everything else here
       is fully meta-tag-effective. img-src allows a.espncdn.com because
       real player photos/team logos are fetched from ESPN's CDN.
       connect-src allows *.workers.dev - a deliberate, narrow addition for
       the optional live Sleeper draft sync. Sleeper's own API doesn't send
       CORS headers, so the browser calls a small Cloudflare Worker proxy
       instead (see cloudflare-worker/sleeper-proxy.js), which is the only
       thing that ever talks to Sleeper directly. Nothing else is permitted
       on this domain, and it's the only third-party domain the browser
       itself is allowed to talk to. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://a.espncdn.com; connect-src 'self' https://*.workers.dev; object-src 'none'; base-uri 'self'; frame-src 'none';" />

  <!-- React and ReactDOM are bundled directly into dist/app.js at build
       time (see package.json "build" script) - not loaded from a CDN.
       Loading a UI framework from a third-party CDN with no integrity
       verification means a compromised or hijacked CDN could serve
       arbitrary JavaScript to every visitor; bundling removes that trust
       boundary entirely. -->

  <!-- Tailwind, precompiled at build time (see package.json "build-css"
       script and .github/workflows/deploy.yml) - not the CDN script, which
       Tailwind's own team explicitly warns against for production. -->
  <link rel="stylesheet" href="./dist/tailwind.css" />

  <!-- Fonts, self-hosted (see package.json "build-fonts" script and
       scripts/build-fonts.mjs) - not loaded from Google's Fonts CDN, which
       sends every visitor's IP address to Google on every page load just
       to fetch a typeface. -->
  <link rel="stylesheet" href="./dist/fonts.css" />

  <style>
    html, body, #root { height: 100%; margin: 0; background: #0A100D; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Compiled from app.jsx by the build step (see package.json "build" script
       and .github/workflows/deploy.yml). Don't hand-edit dist/app.js — edit
       app.jsx and rebuild. app.jsx renders itself into #root directly - see
       the bootstrap block at the very bottom of that file. -->
  <script src="./dist/app.js"></script>
</body>
</html>
