  <!-- React and ReactDOM are bundled directly into dist/app.js at build

       Loading a UI framework from a third-party CDN with no integrity
       verification means a compromised or hijacked CDN could serve
       arbitrary JavaScript to every visitor; bundling removes that trust
       boundary entirely. -->

  <!-- Tailwind, precompiled at build time (see package.json "build-css"
       script and .github/workflows/deploy.yml) - not the CDN script, which
       Tailwind's own team explicitly warns against for production. -->
  <link rel="stylesheet" href="./dist/tailwind.css" />

  <style>
    html, body, #root { height: 100%; margin: 0; background: #0A100D; }
  </style>

  <div id="root"></div>

  <!-- Compiled from app.jsx by the build step (see package.json "build" script
       and .github/workflows/deploy.yml). Don't hand-edit dist/app.js — edit
       app.jsx and rebuild. app.jsx renders itself into #root directly - see
       the bootstrap block at the very bottom of that file. -->
  <script src="./dist/app.js"></script>
</body>
